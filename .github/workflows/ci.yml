name: CI

# Type checks, formatting and tests for the app, the coordinator scripts and
# the broker, on every push to an instance branch or to develop and on every
# pull request against them.
on:
  push:
    branches: [develop, testing, staging, main]
  pull_request:
    branches: [develop, testing, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx prettier --check .
      - run: npm test

  broker:
    name: Broker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r broker/requirements.txt
      - run: pip install -r broker/requirements-dev.txt
      - run: black --check broker
      - run: python -m unittest broker.test_app broker.test_registry
