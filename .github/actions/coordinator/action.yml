name: Run the central coordinator
description: >
  Runs the coordinator entry point for one campaign event. campaign.yml checks
  out this repository at the campaign's automation.ref and uses this action
  from that checkout, so these steps come from the same ref as the coordinator
  code.

inputs:
  path:
    description: Entry point within the central checkout (automation.path of config.yaml).
    required: true

runs:
  using: composite
  steps:
    # .nvmrc of the central checkout names the oldest Node the coordinator
    # runs on. The runner's own `node` is used when it is at least that
    # version. Otherwise the newest such version in the runner's tool cache
    # goes on the path; the cache keeps several Node versions unpacked, each
    # with a marker file once it is complete. sort -V puts the older of two
    # versions first.
    - name: Use the runner's Node
      id: node
      shell: bash
      run: |
        want="$(tr -d 'v[:space:]' < central/.nvmrc)"
        at_least() { [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n 1)" = "$1" ]; }
        have="$(node --version 2>/dev/null | tr -d 'v[:space:]' || true)"
        if [ -n "$have" ] && at_least "$want" "$have"; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        case "$RUNNER_ARCH" in ARM64) arch=arm64 ;; *) arch=x64 ;; esac
        best=""
        for marker in "$RUNNER_TOOL_CACHE"/node/*/"$arch.complete"; do
          dir="${marker%.complete}"
          version="$(basename "$(dirname "$marker")")"
          if [ ! -f "$marker" ] || [ ! -x "$dir/bin/node" ]; then continue; fi
          if at_least "${best:-$want}" "$version"; then best="$version"; fi
        done
        if [ -n "$best" ]; then
          echo "$RUNNER_TOOL_CACHE/node/$best/$arch/bin" >> "$GITHUB_PATH"
          echo "found=true" >> "$GITHUB_OUTPUT"
        fi

    # A runner without such a version downloads the one .nvmrc names. The
    # coordinator runs without installing dependencies, so no package cache.
    - name: Set up Node
      if: steps.node.outputs.found != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: central/.nvmrc
        package-manager-cache: false

    # Node runs the coordinator's TypeScript directly (type stripping,
    # Node 22.18 or later); an older Node fails the run step with an
    # unknown-extension error. The entry point reaches the shell as an
    # environment variable, quoted, never expanded into the command line.
    - name: Run the central coordinator
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CENTRAL_PATH: ${{ inputs.path }}
        BASE_REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        # Numeric account id is the identity written to the tracking tables;
        # the login rides alongside for human-readable commit messages only.
        PR_AUTHOR: ${{ github.event.pull_request.user.id }}
        PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
      # A run ends after 30 minutes whatever it is doing, and fails. The
      # schema check of a score at GitHub's 100 MB file limit takes about a
      # minute.
      # The entry point must be the one this checkout ships; any other path
      # fails the run before anything is executed.
      run: |
        if [ "$CENTRAL_PATH" != "scripts/coordinator.ts" ]; then
          echo "config.yaml: automation.path must be scripts/coordinator.ts, got '$CENTRAL_PATH'." >&2
          exit 1
        fi
        echo "runner node: $(node --version)"
        timeout 30m node "central/$CENTRAL_PATH"
